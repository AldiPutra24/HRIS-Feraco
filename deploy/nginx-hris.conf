# nginx reverse proxy for HRIS (hris.feraco.co.id) + Recruitment portal (recruitment.feraco.co.id).
# Frontend (Next.js) on 127.0.0.1:3000, Django API on 127.0.0.1:8000.

# Redirect HTTP to HTTPS — all domains
server {
    listen 80;
    server_name hris.feraco.co.id hris.agentlab.my.id recruitment.feraco.co.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Redirect old domain HTTPS to new domain
server {
    listen 443 ssl;
    server_name hris.agentlab.my.id;

    ssl_certificate /etc/letsencrypt/live/hris.agentlab.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.agentlab.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hris.feraco.co.id$request_uri;
}

    ssl_certificate /etc/letsencrypt/live/hris.agentlab.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.agentlab.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hris.feraco.co.id$request_uri;
}

# Main HTTPS server block
server {
    listen 443 ssl;
    server_name hris.feraco.co.id;

    ssl_certificate /etc/letsencrypt/live/hris.feraco.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hris.feraco.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Recruitment portal HTTPS — public job pages only.
# Routes /jobs/* to the same Next.js app; hostname middleware
# redirects any non-/jobs path back to hris.feraco.co.id.
server {
    listen 443 ssl;
    server_name recruitment.feraco.co.id;

    ssl_certificate /etc/letsencrypt/live/recruitment.feraco.co.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/recruitment.feraco.co.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

